<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ব্লাড ডোনার</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#B3122B"><meta name="color-scheme" content="light dark"><link rel="icon" href="icon-192.png">
<style>
:root{--r:#B3122B;--r2:#8E0E21;--rt:#B3122B;--ink:#1B1F2A;--bg:#F3F5F8;--card:#fff;--g:#12805C;--m:#5F6877;--line:#E3E7ED;--chip:#F1F3F7;--me:#FBE3E7;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05)}
@media(prefers-color-scheme:dark){:root{--rt:#FF7A8C;--ink:#EEF0F4;--bg:#0F1218;--card:#1A1E27;--g:#3FBF8F;--m:#9AA3B2;--line:#2A303C;--chip:#252B36;--me:#4A1822;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0;font-family:"Noto Sans Bengali","Kalpurush","Hind Siliguri",system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);padding-bottom:72px;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(135deg,var(--r),var(--r2));color:#fff;padding:15px 16px;font-size:19px;font-weight:700;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.w{padding:14px}
input,select,textarea,button{font-size:16px;padding:12px 14px;min-height:48px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--card);color:var(--ink);margin-bottom:10px;transition:border-color .15s,box-shadow .15s,transform .1s}
input::placeholder{color:var(--m)}
input:focus,select:focus{outline:0;border-color:var(--r);box-shadow:0 0 0 3px rgba(179,18,43,.18)}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(179,18,43,.4);outline-offset:2px}
button.p,.p{background:linear-gradient(135deg,var(--r),var(--r2));color:#fff;border:0;font-weight:700;box-shadow:0 4px 12px rgba(179,18,43,.3)}
label{display:block;color:var(--m);font-size:14px;margin:2px 2px 6px}
.card{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px;box-shadow:var(--sh)}
.card.u{border-left:5px solid var(--r)}
.b{min-width:50px;height:50px;border-radius:14px;background:linear-gradient(145deg,var(--r),var(--r2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;box-shadow:0 3px 8px rgba(179,18,43,.3)}
.i{flex:1;min-width:0}.i b{font-size:17px}.i small{display:block;color:var(--m);font-size:14px;margin-top:1px}
.g{color:var(--g)}.r{color:var(--rt)}
.i .g,.i .r{display:inline-block;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;line-height:20px}
.i .g{background:rgba(18,128,92,.13)}.i .r{background:rgba(179,18,43,.12)}
.ac{display:flex;gap:6px}.ac a,.ac button{width:42px;height:42px;min-height:0;padding:0;margin:0;display:grid;place-items:center;text-decoration:none;font-size:19px;border-radius:50%;background:var(--chip);border:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(16,24,40,.06)}
nav button{border:0;border-radius:0;margin:0;font-size:13px;padding:10px 2px 8px;background:transparent;color:var(--m);min-height:56px}
nav button.on{color:var(--rt);font-weight:700;box-shadow:inset 0 3px 0 var(--r)}
.row{display:flex;gap:8px}.row>*{flex:1}
#cm{height:calc(100vh - 150px);height:calc(100dvh - 150px);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 12px;border-radius:16px 16px 16px 4px;background:var(--card);align-self:flex-start;box-shadow:var(--sh)}
.m.me{background:var(--me);align-self:flex-end;border-radius:16px 16px 4px 16px}
.m small{display:block;color:var(--m);font-size:11px;margin-top:2px}
.m audio{width:210px;height:38px}
.cb{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.cb input{margin:0;border-radius:24px}.cb button{width:48px;margin:0;padding:0;border-radius:50%}
.rec{background:var(--r)!important;color:#fff}
.lb{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--ink);font-size:15px}.lb input{width:auto;min-height:0;margin:0;accent-color:var(--r)}
.c{text-align:center;padding:30px;color:var(--m)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"><p class="c">লোড হচ্ছে...</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== এখানে আপনার Firebase কনফিগ বসান =====
const CFG={apiKey:"AIzaSyCK-H24hh88MYifC5EB1ylFJc-S6xVseE8",authDomain:"blood-donar-banibaha.firebaseapp.com",projectId:"blood-donar-banibaha",storageBucket:"blood-donar-banibaha.firebasestorage.app",messagingSenderId:"426856386532",appId:"1:426856386532:web:436b074eae3ea2d2c541f1"};
// অ্যাডমিনের UID (প্রোফাইল ট্যাবে নিজের UID দেখা যাবে, সেটা এখানে বসান)
const ADMIN="xMKjp1K97LcLaLFPrZnoBszgCyD3";
// ============================================
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G=['A+','A-','B+','B-','O+','O-','AB+','AB-'];
const opts=(sel)=>G.map(g=>`<option ${g===sel?'selected':''}>${g}</option>`).join('');
let U,ME,USERS=[],URG=[],CHATS=[],tab='home',flt='',q='',inChat=false,CID,unsub;
const ok=u=>u.avail&&(!u.last||(Date.now()-new Date(u.last))/864e5>=120);

auth.onAuthStateChanged(async u=>{
  if(!u){auth.signInAnonymously().catch(e=>A.innerHTML='<p class="c">লগইন করা যায়নি: '+esc(e.message)+'</p>');return}
  U=u;const s=await db.collection('users').doc(u.uid).get();
  if(s.exists){ME=s.data();start()}else regView('')});

const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('blood-app:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const dd=a=>{const m={};a.forEach(u=>{if(!m[u.phone]||(u.ts||0)>(m[u.phone].ts||0))m[u.phone]=u});return Object.values(m)};
let DP=null;
const UA=navigator.userAgent,STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone,WV=/; wv\)/.test(UA),INAPP=/FBAN|FBAV|FB_IAB|Instagram|Messenger/i.test(UA);
function banner(){
 if(STANDALONE||WV)return '';
 if(DP)return '<button class="p" style="font-size:18px;padding:14px" onclick="inst()">📲 অ্যাপ ইনস্টল করুন (ফ্রি)</button>';
 if(INAPP)return '<div class="card" style="flex-direction:column;align-items:stretch;border-left:5px solid var(--r)"><b>📲 অ্যাপ ইনস্টল করতে</b><small style="color:var(--m)">ফেসবুকের ভেতরে ইনস্টল হয় না। উপরে ডানের তিন ডটে চেপে <b>"Open in Chrome"</b> (ক্রোমে খুলুন) বেছে নিন, তখন এখানে ইনস্টল বাটন আসবে।</small><button onclick="cp()" style="margin-top:8px">🔗 লিংক কপি করুন</button></div>';
 return '<div class="card" style="flex-direction:column;align-items:stretch;border-left:5px solid var(--r)"><b>📲 অ্যাপ ইনস্টল করতে</b><small style="color:var(--m)">Chrome এর ডানের তিন ডটে চেপে <b>"Install app"</b> বা <b>"Add to Home screen"</b> চাপুন।</small></div>'}
function rb(){const e=document.getElementById('ib');if(e)e.innerHTML=banner()}
async function inst(){if(!DP)return;DP.prompt();try{await DP.userChoice}catch(e){}DP=null;rb()}
function cp(){const u=location.href.split('#')[0];(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('লিংক কপি হয়েছে। Chrome এ পেস্ট করে খুলুন।')).catch(()=>prompt('এই লিংক কপি করুন:',u))}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;rb()});
addEventListener('appinstalled',()=>{DP=null;rb()});
function regView(m){const n=m==='in';
A.innerHTML=`<header>🩸 ${n?'আবার ঢুকুন':'রক্তদাতা হিসেবে যোগ দিন'}</header><form class="w" onsubmit="${n?'login':'reg'}(event)">
<div id="ib">${banner()}</div>
${n?'':'<input name="name" placeholder="আপনার নাম" required>'}
<input name="phone" placeholder="মোবাইল নাম্বার (01XXXXXXXXX)" inputmode="tel" required>
${n?'':`<select name="group">${opts()}</select><input name="area" placeholder="এলাকা (যেমন: বানিবহ)" required><label>সর্বশেষ রক্ত দিয়েছেন (না দিলে খালি রাখুন)</label><input name="last" type="date">`}
<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" placeholder="${n?'আপনার পিন':'৪-৬ ডিজিটের গোপন পিন দিন (মনে রাখুন)'}" required>
${n?'':'<label class="lb"><input type="checkbox" name="ok"> আমার নাম ও নাম্বার সবাইকে দেখানোর অনুমতি দিচ্ছি</label>'}
<button class="p">${n?'ঢুকুন':'যোগ দিন'}</button>
<p class="c r" style="padding:14px" onclick="regView('${n?'':'in'}')">${n?'নতুন রেজিস্ট্রেশন করুন':'আগে রেজিস্ট্রেশন করেছেন? পিন দিয়ে ঢুকুন'}</p></form>`}
async function reg(e){e.preventDefault();const f=e.target;
  if(!f.ok.checked)return alert('নাম্বার দেখানোর অনুমতি টিক দিন');
  const d={name:f.name.value.trim(),phone:f.phone.value.trim(),group:f.group.value,area:f.area.value.trim(),last:f.last.value||'',avail:true,ts:Date.now(),pin:true},pin=f.pin.value;
  if(!/^01\d{9}$/.test(d.phone))return alert('সঠিক ১১ ডিজিটের নাম্বার দিন');
  if(!/^\d{4,6}$/.test(pin))return alert('পিন ৪-৬ ডিজিটের সংখ্যা হতে হবে');
  try{const cid=await H(d.phone+':'+pin),cs=await db.collection('creds').doc(cid).get();
    if(cs.exists&&(await db.collection('users').doc(cs.data().uid).get()).exists)return alert('এই নাম্বার ও পিন দিয়ে আগেই রেজিস্ট্রেশন হয়েছে। নিচে "পিন দিয়ে ঢুকুন" চাপুন।');
    const ex=await db.collection('users').where('phone','==',d.phone).get();
    if(ex.docs.some(x=>x.data().pin))return alert('এই নাম্বার আগেই রেজিস্ট্রেশন হয়েছে। নিচে "পিন দিয়ে ঢুকুন" চাপুন।');
    await db.collection('users').doc(U.uid).set(d);
    await db.collection('creds').doc(cid).set({uid:U.uid,phone:d.phone});
    ME=d;start()}catch(x){alert('সমস্যা হয়েছে: '+x.message)}}
async function login(e){e.preventDefault();const f=e.target,ph=f.phone.value.trim();
  try{const cid=await H(ph+':'+f.pin.value),c=await db.collection('creds').doc(cid).get();
    if(!c.exists)return alert('নাম্বার বা পিন ঠিক নয়');
    const o=await db.collection('users').doc(c.data().uid).get();
    if(!o.exists)return alert('প্রোফাইল পাওয়া যায়নি। নতুন করে রেজিস্ট্রেশন করুন।');
    const d={...o.data(),ts:Date.now()};
    await db.collection('users').doc(U.uid).set(d);
    await db.collection('creds').doc(cid).update({uid:U.uid,phone:d.phone});
    ME=d;start()}catch(x){alert('সমস্যা হয়েছে: '+x.message)}}
async function setPin(){const p=$('#pn').value;if(!/^\d{4,6}$/.test(p))return alert('পিন ৪-৬ ডিজিটের সংখ্যা হতে হবে');
  try{const cid=await H(ME.phone+':'+p);if((await db.collection('creds').doc(cid).get()).exists)return alert('এই পিন নেওয়া যাচ্ছে না, অন্য পিন দিন');
    await db.collection('creds').doc(cid).set({uid:U.uid,phone:ME.phone});await db.collection('users').doc(U.uid).update({pin:true});ME.pin=true;render();alert('পিন সেট হয়েছে। মনে রাখুন।')}catch(x){alert('সমস্যা: '+x.message)}}
async function delU(ph){if(!confirm('এই নাম্বারের সব প্রোফাইল মুছবেন?'))return;const s=await db.collection('users').where('phone','==',ph).get();await Promise.all(s.docs.map(d=>d.ref.delete()))}

function start(){
  db.collection('users').onSnapshot(s=>{USERS=dd(s.docs.map(d=>({id:d.id,...d.data()})));if(!inChat)render()});
  db.collection('urgent').orderBy('ts','desc').limit(30).onSnapshot(s=>{URG=s.docs.map(d=>({id:d.id,...d.data()}));if(!inChat)render()});
  db.collection('chats').where('members','array-contains',U.uid).onSnapshot(s=>{CHATS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);if(!inChat)render()});
  db.collection('calls').where('to','==',U.uid).where('status','==','ringing').onSnapshot(q=>q.docChanges().forEach(c=>{
    if(c.type==='added'){const d=c.doc.data();if(Date.now()-d.ts<60000&&!CALL){CALL=c.doc.id;RING=c.doc.id;ring(c.doc.id,d)}}
    if(c.type==='removed'&&RING===c.doc.id){RING=null;finish('কল শেষ হয়েছে')}}));
  render()}

const adm=()=>U.uid===ADMIN;
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
function ago(l){if(!l)return 'এখনো দেননি';const t=Math.floor((Date.now()-new Date(l))/864e5);if(isNaN(t))return 'জানা নেই';if(t<=0)return 'আজ';if(t<30)return bn(t)+' দিন আগে';
  if(t<365){const m=Math.floor(t/30),d=t%30;return bn(m)+' মাস'+(d?' '+bn(d)+' দিন':'')+' আগে'}const y=Math.floor(t/365),m=Math.floor((t%365)/30);return bn(y)+' বছর'+(m?' '+bn(m)+' মাস':'')+' আগে'}
const card=u=>`<div class="card"><div class="b">${esc(u.group)}</div><div class="i"><b>${esc(u.name)}</b><small>${esc(u.area)} • ${ok(u)?'<span class="g">দিতে পারবে</span>':'<span class="r">এখন পারবে না</span>'}</small><small>${esc(u.phone)}</small><small>🩸 শেষ রক্তদান: ${ago(u.last)}</small></div><div class="ac"><a href="tel:${esc(u.phone)}">📞</a><a href="https://wa.me/88${esc(u.phone)}">🟢</a>${u.id!==U.uid?`<button onclick="pm('${u.id}')">✉️</button>`:''}${adm()?`<button onclick="delU('${esc(u.phone)}')">🗑</button>`:''}</div></div>`;
function list(){const t=q.toLowerCase();
  const l=USERS.filter(u=>(!flt||u.group===flt)&&(!t||(u.name+u.area+u.phone).toLowerCase().includes(t))).sort((a,b)=>ok(b)-ok(a));
  return l.length?`<p style="margin:4px 0 8px;color:var(--m)">${l.length} জন দাতা</p>`+l.map(card).join(''):'<p class="c">কোনো দাতা পাওয়া যায়নি। অন্য গ্রুপ বা নাম দিয়ে খুঁজুন।</p>'}
function upd(){$('#l').innerHTML=list()}
function render(){
  let c='';
  if(tab==='home')c=`<input placeholder="🔍 নাম, এলাকা বা নাম্বার" value="${esc(q)}" oninput="q=this.value;upd()"><select onchange="flt=this.value;upd()"><option value="">সব ব্লাড গ্রুপ</option>${G.map(g=>`<option ${g===flt?'selected':''}>${g}</option>`).join('')}</select><div id="l">${list()}</div>`;
  if(tab==='urg')c=`<form onsubmit="post(event)"><select name="group">${opts()}</select><input name="place" placeholder="হাসপাতাল / এলাকা" required><input name="phone" value="${esc(ME.phone)}" placeholder="যোগাযোগ নাম্বার" required><input name="note" placeholder="কী লাগবে? (যেমন: ২ ব্যাগ, আজ রাতে)"><button class="p">🚨 জরুরি পোস্ট করুন</button></form>`+
    (URG.length?URG.map(p=>`<div class="card u"><div class="b">${esc(p.group)}</div><div class="i"><b>${esc(p.place)}</b><small>${esc(p.note)}</small><small>${esc(p.name)} • ${new Date(p.ts).toLocaleDateString('bn-BD')}</small></div><div class="ac"><a href="tel:${esc(p.phone)}">📞</a>${(p.uid===U.uid||adm())?`<button onclick="del('urgent','${p.id}')">🗑</button>`:''}</div></div>`).join(''):'<p class="c">এখন কোনো জরুরি অনুরোধ নেই।</p>');
  if(tab==='chat')c=`<div class="card" onclick="openChat('all','সবার গ্রুপ')"><div class="b">👥</div><div class="i"><b>সবার গ্রুপ</b><small>সব দাতা ও গ্রহীতা একসাথে</small></div></div>`+
    CHATS.map(x=>{const o=Object.keys(x.names).find(k=>k!==U.uid);return `<div class="card" onclick="openChat('${x.id}','${esc(x.names[o]||'চ্যাট')}')"><div class="b">✉️</div><div class="i"><b>${esc(x.names[o]||'চ্যাট')}</b><small>${esc(x.last||'')}</small></div></div>`}).join('');
  if(tab==='me')c=`<div class="card"><div class="b">${esc(ME.group)}</div><div class="i"><b>${esc(ME.name)}</b><small>${esc(ME.phone)} • ${esc(ME.area)}</small></div></div>
    <label class="lb"><input type="checkbox" id="av" ${ME.avail?'checked':''}> আমি রক্ত দিতে প্রস্তুত</label>
    <label>সর্বশেষ রক্ত দিয়েছি</label><input type="date" id="la" value="${esc(ME.last)}">
    <button class="p" onclick="saveMe()">সংরক্ষণ করুন</button>
    ${ME.pin?'':`<div class="card" style="flex-direction:column;align-items:stretch"><b>🔒 পিন সেট করুন</b><small style="color:var(--m)">আনইনস্টল করে আবার ঢুকতে এই পিন লাগবে</small><input id="pn" type="password" inputmode="numeric" maxlength="6" placeholder="৪-৬ ডিজিটের পিন"><button class="p" onclick="setPin()">পিন সংরক্ষণ</button></div>`}
    <p style="color:var(--m);font-size:12px;word-break:break-all">আপনার UID: ${U.uid}</p><div class="card" style="flex-direction:column;align-items:flex-start;margin-top:14px"><b>এই অ্যাপ সম্পর্কে</b><small style="color:var(--m)">রক্তদাতা খোঁজার জন্য এই অ্যাপটি তৈরি করেছেন<br><b style="color:var(--ink)">রুহুল আমিন</b><br>রুহুল আমিন মোবাইল সার্ভিসিং সেন্টার, বানিবহ, রাজবাড়ী</small></div>`;
  A.innerHTML=`<header>🩸 ব্লাড ডোনার</header><div class="w">${c}</div><nav>${[['home','🏠 দাতা'],['urg','🚨 জরুরি'],['chat','💬 চ্যাট'],['me','👤 আমি']].map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</nav>`}

async function saveMe(){const d={avail:$('#av').checked,last:$('#la').value||''};await db.collection('users').doc(U.uid).update(d);Object.assign(ME,d);alert('সংরক্ষণ হয়েছে')}
async function post(e){e.preventDefault();const f=e.target;
  await db.collection('urgent').add({group:f.group.value,place:f.place.value.trim(),phone:f.phone.value.trim(),note:f.note.value.trim(),name:ME.name,uid:U.uid,ts:Date.now()});f.reset()}
async function del(c,id){if(confirm('মুছে ফেলবেন?'))await db.collection(c).doc(id).delete()}
async function pm(id){const o=USERS.find(u=>u.id===id),cid=[U.uid,id].sort().join('_');
  await db.collection('chats').doc(cid).set({members:[U.uid,id],names:{[U.uid]:ME.name,[id]:o.name},ts:Date.now()},{merge:true});openChat(cid,o.name)}

let CT='';
function openChat(cid,title){inChat=true;CID=cid;CT=title;
  A.innerHTML=`<header><span onclick="closeChat()" style="margin-right:12px">←</span>${esc(title)}${cid==='all'?'':`<span style="float:right" onclick="startCall('${cid.split('_').find(x=>x!==U.uid)}',CT)">📞</span>`}</header><div id="cm"></div><div class="cb"><button id="mic" onclick="mic()">🎤</button><input id="tx" placeholder="মেসেজ লিখুন" onkeydown="if(event.key==='Enter')sendT()"><button class="p" onclick="sendT()">➤</button></div>`;
  unsub=db.collection('chats').doc(cid).collection('m').orderBy('ts','desc').limit(100).onSnapshot(s=>{
    const b=$('#cm');if(!b)return;
    b.innerHTML=s.docs.reverse().map(d=>{const m=d.data(),me=m.from===U.uid;
      return `<div class="m ${me?'me':''}">${me?'':`<small>${esc(m.name)}</small>`}${m.type==='voice'?`<audio controls src="${esc(m.data)}"></audio>`:esc(m.text)}<small>${new Date(m.ts).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})}</small></div>`}).join('');
    b.scrollTop=b.scrollHeight})}
function closeChat(){unsub&&unsub();inChat=false;render()}
async function send(m){Object.assign(m,{from:U.uid,name:ME.name,ts:Date.now()});
  await db.collection('chats').doc(CID).collection('m').add(m);
  if(CID!=='all')db.collection('chats').doc(CID).set({ts:m.ts,last:m.type==='voice'?'🎤 ভয়েস মেসেজ':m.text},{merge:true})}
function sendT(){const t=$('#tx'),v=t.value.trim();if(!v)return;t.value='';send({type:'text',text:v})}

let rec,chunks,tm;
async function mic(){const b=$('#mic');
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st,{audioBitsPerSecond:16000});chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(tm);b.textContent='🎤';b.classList.remove('rec');
      const r=new FileReader();r.onload=()=>{if(r.result.length>900000)return alert('ভয়েস অনেক বড়, ছোট করে পাঠান');send({type:'voice',data:r.result})};
      r.readAsDataURL(new Blob(chunks,{type:rec.mimeType}))};
    rec.start();b.textContent='⏹';b.classList.add('rec');tm=setTimeout(()=>rec.stop(),60000)
  }catch(e){alert('মাইক চালু করা যায়নি। অ্যাপের মাইক পারমিশন দিন।')}}

// ===== অনলাইন ভয়েস কল =====
let PC,LS,CALL=null,RING=null,CU=[],PEND=[],RT,CN='',TT;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function cui(h){let e=$('#cu');if(!e){e=document.createElement('div');e.id='cu';e.style.cssText='position:fixed;inset:0;background:rgba(27,31,42,.94);color:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px';document.body.appendChild(e)}e.innerHTML=h}
const cbtn=(t,f,c)=>`<button onclick="${f}" style="width:200px;background:${c};color:#fff;border:0;font-weight:700">${t}</button>`;
function newPC(){const p=new RTCPeerConnection(ICE);PEND=[];
  p.ontrack=e=>{let a=$('#ra');if(!a){a=document.createElement('audio');a.id='ra';a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play&&a.play().catch(()=>{})};
  p.onconnectionstatechange=()=>{if(p.connectionState==='connected'){clearTimeout(RT);const t0=Date.now();clearInterval(TT);
      cui(`<div style="font-size:56px">🎧</div><h2>${esc(CN)}</h2><div id="tm" style="font-size:26px">00:00</div>`+cbtn('কাটুন','hang()','#B3122B'));
      TT=setInterval(()=>{const e=$('#tm');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},1000)}
    else if(p.connectionState==='failed')hang('সংযোগ হয়নি। নেটওয়ার্কের কারণে কল লাগেনি।')};
  return p}
function watch(ref,caller){
  const u1=ref.onSnapshot(async s=>{const d=s.data();if(!d||!PC)return;
    if(caller&&d.answer&&!PC.remoteDescription){await PC.setRemoteDescription(d.answer);PEND.forEach(c=>PC.addIceCandidate(c).catch(()=>{}));PEND=[]}
    if(d.status==='ended'||d.status==='rejected')finish(d.status==='rejected'?'কল কেটে দিয়েছে':'কল শেষ হয়েছে')});
  const u2=ref.collection('cand').onSnapshot(q=>q.docChanges().forEach(c=>{if(c.type!=='added')return;const x=c.doc.data();if(x.from===U.uid||!PC)return;
    const ic=JSON.parse(x.c);PC.remoteDescription?PC.addIceCandidate(ic).catch(()=>{}):PEND.push(ic)}));
  CU=[u1,u2]}
async function mic0(){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('মাইক চালু করা যায়নি। অ্যাপের মাইকের অনুমতি দিন।');return null}}
async function startCall(to,name){if(CALL||!to)return;LS=await mic0();if(!LS)return;CN=name;
  const ref=db.collection('calls').doc();CALL=ref.id;PC=newPC();LS.getTracks().forEach(t=>PC.addTrack(t,LS));
  PC.onicecandidate=e=>e.candidate&&ref.collection('cand').add({from:U.uid,c:JSON.stringify(e.candidate)}).catch(()=>{});
  try{const o=await PC.createOffer();
    await ref.set({from:U.uid,fromName:ME.name,to,status:'ringing',offer:{type:o.type,sdp:o.sdp},ts:Date.now()});
    await PC.setLocalDescription(o)}catch(e){return finish('কল শুরু করা যায়নি')}
  cui(`<div style="font-size:56px">📞</div><h2>${esc(name)} কে কল হচ্ছে...</h2>`+cbtn('কাটুন','hang()','#B3122B'));
  watch(ref,true);RT=setTimeout(()=>hang('কেউ ধরেনি'),45000)}
function ring(id,d){CN=d.fromName||'কেউ';try{navigator.vibrate&&navigator.vibrate([500,300,500,300,500])}catch(e){}
  cui(`<div style="font-size:56px">📞</div><h2>${esc(CN)} কল করছে</h2>`+cbtn('ধরুন','answer()','#12805C')+cbtn('কাটুন','reject()','#B3122B'))}
async function answer(){const id=RING;if(!id)return;RING=null;LS=await mic0();if(!LS)return reject();
  const ref=db.collection('calls').doc(id);
  try{const d=(await ref.get()).data();if(!d||d.status!=='ringing')return finish('কল শেষ হয়ে গেছে');
    PC=newPC();LS.getTracks().forEach(t=>PC.addTrack(t,LS));
    PC.onicecandidate=e=>e.candidate&&ref.collection('cand').add({from:U.uid,c:JSON.stringify(e.candidate)}).catch(()=>{});
    await PC.setRemoteDescription(d.offer);const a=await PC.createAnswer();await PC.setLocalDescription(a);
    await ref.update({answer:{type:a.type,sdp:a.sdp},status:'accepted'});
    cui(`<h2>${esc(CN)}</h2><p>সংযোগ হচ্ছে...</p>`+cbtn('কাটুন','hang()','#B3122B'));watch(ref,false);
    RT=setTimeout(()=>{if(PC&&PC.connectionState!=='connected')hang('সংযোগ হয়নি')},20000)}catch(e){finish('কল ধরা যায়নি')}}
function reject(){const id=RING||CALL;RING=null;if(id)db.collection('calls').doc(id).update({status:'rejected'}).catch(()=>{});finish('')}
function hang(m){if(CALL)db.collection('calls').doc(CALL).update({status:'ended'}).catch(()=>{});finish(m||'')}
function finish(m){if(!CALL&&!PC&&!$('#cu'))return;clearTimeout(RT);clearInterval(TT);CU.forEach(f=>f());CU=[];
  try{PC&&PC.close()}catch(e){}PC=null;LS&&LS.getTracks().forEach(t=>t.stop());LS=null;CALL=null;RING=null;PEND=[];
  const a=$('#ra');a&&a.remove();
  if(m){cui(`<h2>${esc(m)}</h2>`);setTimeout(()=>{const e=$('#cu');e&&e.remove()},1800)}else{const e=$('#cu');e&&e.remove()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
