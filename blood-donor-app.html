<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--r:#E5233F;--r2:#9C0F26;--rt:#FF5A72;--ink:#F2F4F8;--bg:#070A10;--card:#0F141D;--g:#33E08A;--bl:#4DA3FF;--m:#A3ADBD;--line:#232B3A;--chip:#151B26;--me:#4A1822;--sh:0 2px 12px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;font-family:"Noto Sans Bengali","Kalpurush","Hind Siliguri",system-ui,sans-serif}
body{background:radial-gradient(90% 40% at 50% 0,#1a0812 0,#070A10 70%) fixed;color:var(--ink);padding-bottom:92px;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}

input,select,textarea,button{font-size:16px;padding:12px 14px;min-height:48px;border:1px solid var(--line);border-radius:14px;width:100%;background:var(--card);color:var(--ink);margin-bottom:10px;transition:border-color .15s,box-shadow .15s,transform .1s}

label{display:block;color:var(--m);font-size:14px;margin:2px 2px 6px}

.card.dn{opacity:.62}

.mrow{display:flex;gap:10px;margin:0 0 12px}

function stats(){const T=sT(),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(const k in T){const to=T[k];
    if(ST[k]===to){const el=$('#'+k);if(el)el.textContent=bn(SD[k]||0);continue}
    ST[k]=to;const from=SD[k]||0;
    if(rm){SD[k]=to;const el=$('#'+k);if(el)el.textContent=bn(to);continue}
    const t0=performance.now();(function f(t){if(ST[k]!==to)return;const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);SD[k]=Math.round(from+(to-from)*e);const el=$('#'+k);if(el)el.textContent=bn(SD[k]);if(p<1)requestAnimationFrame(f)})(t0)}}

async function countOnline(){if(!U||document.visibilityState!=='visible')return;let n;
  const q=db.collection('presence').where('t','>',firebase.firestore.Timestamp.fromMillis(Date.now()-210000));
  try{if(typeof q.count==='function'){const r=await q.count().get();n=r.data().count}}catch(e){n=undefined}
  if(typeof n!=='number'){try{const r=await q.limit(150).get();n=r.size}catch(e){return}}
  const first=!ONL;ONL=Math.max(1,n);if(first&&tab==='home'&&!inChat)render();else stats()}

<details><summary>🛌 রক্ত দেওয়ার পরে</summary><ul><li>১০–১৫ মিনিট বিশ্রাম নিন, পানি বা জুস খান।</li><li>অন্তত একদিন ভারী কাজ, ব্যায়াম বা ঝুঁকিপূর্ণ কাজ (যেমন গাড়ি চালানো) থেকে বিরত থাকুন।</li><li>মাথা ঘুরলে বা দুর্বল লাগলে শুয়ে পড়ুন, দরকার হলে চিকিৎসকের সাহায্য নিন।</li></ul></details>
<details><summary>⛔ কারা এখন রক্ত দেবেন না</summary><ul><li>জ্বর, ঠান্ডা বা কোনো সংক্রমণ থাকলে।</li><li>গর্ভাবস্থায় এবং প্রসব বা গর্ভপাতের পর ছয় মাস পর্যন্ত।</li><li>হিমোগ্লোবিন কম থাকলে (রক্তস্বল্পতা)।</li><li>রক্তবাহিত রোগ (যেমন হেপাটাইটিস বি বা সি, এইচআইভি) থাকলে। ব্লাড ব্যাংক রক্ত পরীক্ষা করে নেয়।</li></ul></details>
<details><summary>⚠️ দালাল থেকে সাবধান</summary><ul><li>দাতা সরাসরি রোগী বা তাঁর পরিবারের সাথে কথা বলুন।</li><li>কেউ টাকা চাইলে বা টাকার লেনদেনের কথা বললে নিশ্চিত না হয়ে এগোবেন না।</li></ul></details>

  const tg=(id,t,v)=>`<label class="tg"><span>${t}</span><input type="checkbox" id="${id}" ${v?'checked':''}></label>`;
  const e=document.createElement('div');e.id='ppe';e.style.cssText='position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.78);display:flex;align-items:flex-end';e.onclick=ev=>{if(ev.target===e)closeEd()};
  e.innerHTML=`<div class="rvp"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:20px">📢 পপআপ নোটিশ</b><button onclick="closeEd()" style="width:44px;min-height:0;margin:0;padding:8px" aria-label="বন্ধ">✕</button></div>${tg('pp_on','পপআপ চালু',c.on)}${tg('pp_t','লেখা দেখান',c.showText!==false)}${tg('pp_i','ছবি দেখান',c.showImg!==false)}${tg('pp_e','প্রতিবার অ্যাপ খুললে দেখান',c.every)}<label style="margin-top:8px">শিরোনাম (ঐচ্ছিক)</label><input id="pp_ti" maxlength="80" value="${esc(c.title||'')}" placeholder="যেমন: বিশেষ ঘোষণা"><label>মূল লেখা</label><textarea id="pp_tx" rows="5" maxlength="800" placeholder="আপনার বার্তা বা নোটিশ লিখুন (লিংক দিলে চাপা যাবে)">${esc(c.text||'')}</textarea><label>ছবি</label><div id="pp_pv" style="margin-bottom:10px"></div><input type="file" id="pp_f" accept="image/*" hidden onchange="ppPick(this)"><div class="row"><button style="margin:0" onclick="$('#pp_f').click()">📷 ছবি বাছুন</button><button style="margin:0" onclick="PPIMG='';ppPrev()">ছবি মুছুন</button></div><div class="row" style="margin-top:10px"><button style="margin:0" onclick="previewPP()">👁 প্রিভিউ</button><button class="p" style="margin:0" onclick="savePP()">সংরক্ষণ করুন</button></div><small style="display:block;color:var(--m);margin-top:10px">সংরক্ষণ করলে সবাই নতুন নোটিশ হিসেবে একবার দেখবে। "ছবি/লেখা দেখান" বন্ধ রাখলেও সেগুলো সংরক্ষিত থাকে।</small></div>`;
  document.body.appendChild(e);ppPrev()}
function closeEd(){const e=$('#ppe');if(e)e.remove()}
function ppPrev(){const e=$('#pp_pv');if(e)e.innerHTML=PPIMG?`<img src="${PPIMG}" style="width:100%;border-radius:14px;display:block">`:'<small style="color:var(--m)">কোনো ছবি নেই</small>'}
async function ppPick(inp){const f=inp.files&&inp.files[0];if(!f||!/^image\//.test(f.type))return;
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
    let w=Math.min(900,img.width),q=.8,d;for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=w;c.height=Math.round(img.height*w/img.width);c.getContext('2d').drawImage(img,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',q);if(d.length<400000)break;w=Math.round(w*.8);q=Math.max(.55,q-.08)}
    URL.revokeObjectURL(img.src);if(d.length>=450000)return alert('ছবিটা অনেক বড়, ছোট ছবি বাছুন');PPIMG=d;ppPrev()}catch(e){alert('ছবি নেওয়া যায়নি: '+e.message)}}
function ppForm(){return{on:$('#pp_on').checked,showText:$('#pp_t').checked,showImg:$('#pp_i').checked,every:$('#pp_e').checked,title:$('#pp_ti').value.trim().slice(0,80),text:$('#pp_tx').value.trim().slice(0,800)}}
function previewPP(){const c=ppForm();c.ver=0;showPopup(c,c.showImg?PPIMG:'',true)}
async function savePP(){const c=ppForm();c.ver=Date.now();
  try{await db.collection('config').doc('popup').set(c);if(PPIMG!==PPIMG0){await db.collection('config').doc('popupimg').set({img:PPIMG||''});PPIMG0=PPIMG}PPS=0;closeEd();alert('পপআপ সংরক্ষিত হয়েছে'+(c.on?' (চালু)':' (এখন বন্ধ আছে)'))}catch(e){alert('সংরক্ষণ হয়নি: '+e.message)}}
function render(){if(tab!=='me'&&EDIT){EDIT=false;DRAFT=null}if(tab==='me')grabDraft();
  let c='';
  if(tab==='home')c=`<div class="sec"><b>🩸 রক্তদাতা</b><small>এক ফোঁটা রক্ত<br>বাঁচাতে পারে একটি জীবন</small></div><div class="fbar"><div class="srch"><span>🔍</span><input placeholder="নাম, এলাকা বা নাম্বার দিয়ে খুঁজুন" value="${esc(q)}" oninput="q=this.value;upd()"></div><div class="frow"><label class="sel"><small>📍 জেলা</small><select onchange="DST=this.value;upd()">${dopts(DST)}${adm()?`<option value="*" ${DST==='*'?'selected':''}>সব জেলা (অ্যাডমিন)</option>`:''}</select></label><label class="sel"><small>🩸 ব্লাড গ্রুপ</small><select onchange="flt=this.value;upd()"><option value="">সব গ্রুপ</option>${G.map(g=>`<option ${g===flt?'selected':''}>${g}</option>`).join('')}</select></label></div></div><div id="l" class="${ANIM?'ent':''}">${list()}</div>`;
  if(tab==='urg')c=`${dalalCard()}<form onsubmit="post(event)"><select name="group">${opts()}</select><input name="place" placeholder="হাসপাতাল / এলাকা" required><input name="phone" value="${esc(ME.phone)}" placeholder="যোগাযোগ নাম্বার" required><input name="note" placeholder="কী লাগবে? (যেমন: ২ ব্যাগ, আজ রাতে)"><button class="p">🚨 জরুরি পোস্ট করুন</button></form>`+
    (urgList());
  if(tab==='info')c=infoTab();
  if(tab==='chat')c=`<div class="card" onclick="openChat('all','সবার গ্রুপ')"><div class="b">👥</div><div class="i"><b>সবার গ্রুপ</b><small>সব দাতা ও গ্রহীতা একসাথে</small></div></div>`+
    CHATS.map(x=>{const o=Object.keys(x.names).find(k=>k!==U.uid);return `<div class="card" onclick="openChat('${x.id}','${esc(x.names[o]||'চ্যাট')}')"><div class="b">✉️</div><div class="i"><b>${esc(x.names[o]||'চ্যাট')}</b><small>${esc(x.last||'')}</small></div></div>`}).join('');
  if(tab==='me')c=meTab();
  A.innerHTML=`${tab==='home'?hero()+statsHtml():'<header>🩸 ব্লাড ডোনার</header>'}<div class="w${ANIM?' fin':''}">${c}</div><nav>${[['home','🏠','দাতা'],['urg','🚨','জরুরি'],['info','🏥','তথ্য'],['chat','💬','চ্যাট'],['me','👤','আমি']].map(([k,i,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';ANIM=true;render()"><span>${i}</span>${v}</button>`).join('')}</nav>`;if(tab==='home')stats();if(ANIM&&!ANIMT&&(tab!=='home'||USERS.length))ANIMT=setTimeout(()=>{ANIM=false;ANIMT=0},900)}

async function saveMe(){const d={name:$('#en').value.trim(),dist:$('#ed').value,area:$('#ea').value.trim(),group:$('#eg').value,avail:$('#av').checked,last:$('#la').value||'',times:Math.min(999,Math.max(0,Math.floor(Number($('#et').value)||0))),ts:Date.now()};
  if(!d.name||!d.area||!d.dist)return alert('নাম, জেলা ও এলাকা খালি রাখা যাবে না');
  try{await db.collection('users').doc(U.uid).update(d);Object.assign(ME,d);DST=d.dist;EDIT=false;DRAFT=null;render();window.scrollTo(0,0);alert('সংরক্ষণ হয়েছে')}catch(e){alert('সমস্যা: '+e.message)}}
async function post(e){e.preventDefault();const f=e.target;
  await db.collection('urgent').add({group:f.group.value,place:f.place.value.trim(),phone:f.phone.value.trim(),note:f.note.value.trim(),name:ME.name,uid:U.uid,ts:Date.now()});f.reset()}
async function del(c,id){if(confirm('মুছে ফেলবেন?'))await db.collection(c).doc(id).delete()}
async function pm(id){const o=USERS.find(u=>u.id===id),cid=[U.uid,id].sort().join('_');
  await db.collection('chats').doc(cid).set({members:[U.uid,id],names:{[U.uid]:ME.name,[id]:o.name},ts:Date.now()},{merge:true});openChat(cid,o.name)}

let CT='';
function openChat(cid,title){inChat=true;CID=cid;CT=title;
  A.innerHTML=`<header><span onclick="closeChat()" style="margin-right:12px">←</span>${esc(title)}${cid==='all'?'':`<span style="float:right" onclick="startCall('${cid.split('_').find(x=>x!==U.uid)}',CT)">📞</span>`}</header><div id="cm"></div><div class="cb"><button id="mic" onclick="mic()">🎤</button><input id="tx" placeholder="মেসেজ লিখুন" onkeydown="if(event.key==='Enter')sendT()"><button class="p" onclick="sendT()">➤</button></div>`;
  unsub=db.collection('chats').doc(cid).collection('m').orderBy('ts','desc').limit(100).onSnapshot(s=>{
    const b=$('#cm');if(!b)return;
    b.innerHTML=s.docs.reverse().map(d=>{const m=d.data(),me=m.from===U.uid;
      return `<div class="m ${me?'me':''}">${me?'':`<small>${esc(m.name)}</small>`}${m.type==='voice'?`<audio controls src="${esc(m.data)}"></audio>`:esc(m.text)}<small>${new Date(m.ts).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})}</small></div>`}).join('');
    b.scrollTop=b.scrollHeight})}
function closeChat(){unsub&&unsub();inChat=false;render()}
async function send(m){Object.assign(m,{from:U.uid,name:ME.name,ts:Date.now()});
  await db.collection('chats').doc(CID).collection('m').add(m);
  if(CID!=='all')db.collection('chats').doc(CID).set({ts:m.ts,last:m.type==='voice'?'🎤 ভয়েস মেসেজ':m.text},{merge:true})}
function sendT(){const t=$('#tx'),v=t.value.trim();if(!v)return;t.value='';send({type:'text',text:v})}

let rec,chunks,tm;
async function mic(){const b=$('#mic');
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st,{audioBitsPerSecond:16000});chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(tm);b.textContent='🎤';b.classList.remove('rec');
      const r=new FileReader();r.onload=()=>{if(r.result.length>900000)return alert('ভয়েস অনেক বড়, ছোট করে পাঠান');send({type:'voice',data:r.result})};
      r.readAsDataURL(new Blob(chunks,{type:rec.mimeType}))};
    rec.start();b.textContent='⏹';b.classList.add('rec');tm=setTimeout(()=>rec.stop(),60000)
  }catch(e){alert('মাইক চালু করা যায়নি। অ্যাপের মাইক পারমিশন দিন।')}}

// ===== অনলাইন ভয়েস কল =====
let PC,LS,CALL=null,RING=null,CU=[],PEND=[],RT,CN='',TT;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function cui(h){let e=$('#cu');if(!e){e=document.createElement('div');e.id='cu';e.style.cssText='position:fixed;inset:0;background:rgba(27,31,42,.94);color:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px';document.body.appendChild(e)}e.innerHTML=h}
const cbtn=(t,f,c)=>`<button onclick="${f}" style="width:200px;background:${c};color:#fff;border:0;font-weight:700">${t}</button>`;
function newPC(){const p=new RTCPeerConnection(ICE);PEND=[];
  p.ontrack=e=>{let a=$('#ra');if(!a){a=document.createElement('audio');a.id='ra';a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play&&a.play().catch(()=>{})};
  p.onconnectionstatechange=()=>{if(p.connectionState==='connected'){clearTimeout(RT);const t0=Date.now();clearInterval(TT);
      cui(`<div style="font-size:56px">🎧</div><h2>${esc(CN)}</h2><div id="tm" style="font-size:26px">00:00</div>`+cbtn('কাটুন','hang()','#B3122B'));
      TT=setInterval(()=>{const e=$('#tm');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},1000)}
    else if(p.connectionState==='failed')hang('সংযোগ হয়নি। নেটওয়ার্কের কারণে কল লাগেনি।')};
  return p}
function watch(ref,caller){
  const u1=ref.onSnapshot(async s=>{const d=s.data();if(!d||!PC)return;
    if(caller&&d.answer&&!PC.remoteDescription){await PC.setRemoteDescription(d.answer);PEND.forEach(c=>PC.addIceCandidate(c).catch(()=>{}));PEND=[]}
    if(d.status==='ended'||d.status==='rejected')finish(d.status==='rejected'?'কল কেটে দিয়েছে':'কল শেষ হয়েছে')});
  const u2=ref.collection('cand').onSnapshot(q=>q.docChanges().forEach(c=>{if(c.type!=='added')return;const x=c.doc.data();if(x.from===U.uid||!PC)return;
    const ic=JSON.parse(x.c);PC.remoteDescription?PC.addIceCandidate(ic).catch(()=>{}):PEND.push(ic)}));
  CU=[u1,u2]}
async function mic0(){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('মাইক চালু করা যায়নি। অ্যাপের মাইকের অনুমতি দিন।');return null}}
async function startCall(to,name){if(CALL||!to)return;LS=await mic0();if(!LS)return;CN=name;
  const ref=db.collection('calls').doc();CALL=ref.id;PC=newPC();LS.getTracks().forEach(t=>PC.addTrack(t,LS));
  PC.onicecandidate=e=>e.candidate&&ref.collection('cand').add({from:U.uid,c:JSON.stringify(e.candidate)}).catch(()=>{});
  try{const o=await PC.createOffer();
    await ref.set({from:U.uid,fromName:ME.name,to,status:'ringing',offer:{type:o.type,sdp:o.sdp},ts:Date.now()});
    await PC.setLocalDescription(o)}catch(e){return finish('কল শুরু করা যায়নি')}
  cui(`<div style="font-size:56px">📞</div><h2>${esc(name)} কে কল হচ্ছে...</h2>`+cbtn('কাটুন','hang()','#B3122B'));
  watch(ref,true);RT=setTimeout(()=>hang('কেউ ধরেনি'),45000)}
function ring(id,d){CN=d.fromName||'কেউ';try{navigator.vibrate&&navigator.vibrate([500,300,500,300,500])}catch(e){}
  cui(`<div style="font-size:56px">📞</div><h2>${esc(CN)} কল করছে</h2>`+cbtn('ধরুন','answer()','#12805C')+cbtn('কাটুন','reject()','#B3122B'))}
async function answer(){const id=RING;if(!id)return;RING=null;LS=await mic0();if(!LS)return reject();
  const ref=db.collection('calls').doc(id);
  try{const d=(await ref.get()).data();if(!d||d.status!=='ringing')return finish('কল শেষ হয়ে গেছে');
    PC=newPC();LS.getTracks().forEach(t=>PC.addTrack(t,LS));
    PC.onicecandidate=e=>e.candidate&&ref.collection('cand').add({from:U.uid,c:JSON.stringify(e.candidate)}).catch(()=>{});
    await PC.setRemoteDescription(d.offer);const a=await PC.createAnswer();await PC.setLocalDescription(a);
    await ref.update({answer:{type:a.type,sdp:a.sdp},status:'accepted'});
    cui(`<h2>${esc(CN)}</h2><p>সংযোগ হচ্ছে...</p>`+cbtn('কাটুন','hang()','#B3122B'));watch(ref,false);
    RT=setTimeout(()=>{if(PC&&PC.connectionState!=='connected')hang('সংযোগ হয়নি')},20000)}catch(e){finish('কল ধরা যায়নি')}}
function reject(){const id=RING||CALL;RING=null;if(id)db.collection('calls').doc(id).update({status:'rejected'}).catch(()=>{});finish('')}
function hang(m){if(CALL)db.collection('calls').doc(CALL).update({status:'ended'}).catch(()=>{});finish(m||'')}
function finish(m){if(!CALL&&!PC&&!$('#cu'))return;clearTimeout(RT);clearInterval(TT);CU.forEach(f=>f());CU=[];
  try{PC&&PC.close()}catch(e){}PC=null;LS&&LS.getTracks().forEach(t=>t.stop());LS=null;CALL=null;RING=null;PEND=[];
  const a=$('#ra');a&&a.remove();
  if(m){cui(`<h2>${esc(m)}</h2>`);setTimeout(()=>{const e=$('#cu');e&&e.remove()},1800)}else{const e=$('#cu');e&&e.remove()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
