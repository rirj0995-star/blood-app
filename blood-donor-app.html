<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ব্লাড ডোনার</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#070A10"><meta name="color-scheme" content="dark"><link rel="icon" href="icon-192.png">
<style>
:root{--r:#E5233F;--r2:#9C0F26;--rt:#FF5A72;--ink:#F2F4F8;--bg:#070A10;--card:#0F141D;--g:#33E08A;--bl:#4DA3FF;--m:#A3ADBD;--line:#232B3A;--chip:#151B26;--me:#4A1822;--sh:0 2px 12px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;font-family:"Noto Sans Bengali","Kalpurush","Hind Siliguri",system-ui,sans-serif}
body{background:radial-gradient(90% 40% at 50% 0,#1a0812 0,#070A10 70%) fixed;color:var(--ink);padding-bottom:92px;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(135deg,var(--r),var(--r2));color:#fff;padding:15px 16px;font-size:19px;font-weight:700;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px rgba(229,35,63,.35)}
.hero{position:relative;overflow:hidden;padding:20px 14px 30px;background:radial-gradient(120% 160% at 85% 130%,rgba(255,30,60,.55),transparent 60%),linear-gradient(180deg,#240610,#090B12);display:flex;align-items:center;gap:14px}
.hero:after{content:'';position:absolute;left:-25%;right:-25%;bottom:-46px;height:70px;border-radius:50%;border-top:3px solid #ff3355;box-shadow:0 -10px 26px rgba(255,40,70,.65)}
.hero svg{flex:none;overflow:visible;max-width:64px;height:auto;filter:drop-shadow(0 0 10px rgba(255,40,70,.7))}
.hero h1{white-space:nowrap;font-size:31px;font-weight:800;line-height:1.05;color:#fff;font-family:system-ui,sans-serif}.hero h1 span{color:#ff2d4b}
.hero small{display:block;white-space:nowrap;letter-spacing:2px;font-size:10px;color:#d7dbe4;margin-top:6px;font-family:system-ui,sans-serif}
.hero .hh{margin-left:auto;opacity:.9;max-width:52px;margin-top:6px}
.w{padding:14px}
.sec{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 2px 14px}
.sec b{font-size:26px;font-weight:800;display:block;border-bottom:3px solid var(--r);padding-bottom:2px;box-shadow:0 6px 12px -8px var(--r)}
.sec small{color:var(--m);font-size:12px;text-align:right}
input,select,textarea,button{font-size:16px;padding:12px 14px;min-height:48px;border:1px solid var(--line);border-radius:14px;width:100%;background:var(--card);color:var(--ink);margin-bottom:10px;transition:border-color .15s,box-shadow .15s,transform .1s}
input::placeholder{color:var(--m)}
input:focus,select:focus{outline:0;border-color:var(--r);box-shadow:0 0 0 3px rgba(229,35,63,.25)}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(255,90,114,.5);outline-offset:2px}
button.p,.p{background:linear-gradient(135deg,var(--r),var(--r2));color:#fff;border:0;font-weight:700;box-shadow:0 4px 18px rgba(229,35,63,.4)}
label{display:block;color:var(--m);font-size:14px;margin:2px 2px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:12px;box-shadow:var(--sh)}
.card.u{border-left:5px solid var(--r)}
#l .card{align-items:stretch;border-width:1.5px}
#l .card:nth-of-type(3n+1){border-color:#ff2d4b;background:linear-gradient(135deg,rgba(255,45,75,.18),#0F141D 60%);box-shadow:0 0 18px rgba(255,45,75,.3),inset 0 0 16px rgba(255,45,75,.08)}
#l .card:nth-of-type(3n+2){border-color:#2d8cff;background:linear-gradient(135deg,rgba(45,140,255,.18),#0F141D 60%);box-shadow:0 0 18px rgba(45,140,255,.3),inset 0 0 16px rgba(45,140,255,.08)}
#l .card:nth-of-type(3n){border-color:#9b5cff;background:linear-gradient(135deg,rgba(155,92,255,.2),#0F141D 60%);box-shadow:0 0 18px rgba(155,92,255,.3),inset 0 0 16px rgba(155,92,255,.08)}
.b{min-width:52px;height:52px;border-radius:16px;background:linear-gradient(150deg,#ff3b57,#a50f27);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 4px 12px rgba(229,35,63,.5),inset 0 2px 0 rgba(255,255,255,.35);align-self:flex-start;margin-top:4px}
.i{flex:1;min-width:0}.i>b{font-size:18px}.i small{display:block;color:var(--m);font-size:13px;margin-top:2px}
.g{color:var(--g)}.r{color:var(--rt)}
.st{display:inline-flex;align-items:center;gap:7px;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid}
.st:before{content:'';width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.st.g{background:rgba(51,224,138,.12);border-color:rgba(51,224,138,.55)}.st.r{background:rgba(255,90,114,.12);border-color:rgba(255,90,114,.55)}
.r2{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:space-between;margin-top:8px}
.ph{color:var(--ink)!important;font-size:15px!important;margin-top:6px!important}
.ac{display:flex;gap:6px}.ac a,.ac button{width:36px;height:36px;min-height:0;padding:0;margin:0;display:grid;place-items:center;text-decoration:none;border-radius:50%;background:rgba(0,0,0,.25);border:1.5px solid;color:var(--g);box-shadow:0 0 10px currentColor}
.ac .bl{color:var(--bl)}.ac .rd{color:var(--rt)}
.ac svg{width:18px;height:18px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,20,29,.96);backdrop-filter:blur(10px);display:flex;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 24px rgba(0,0,0,.5)}
nav button{border:0;border-radius:0;margin:0;font-size:13px;padding:8px 2px 8px;background:transparent;color:var(--m);min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--rt);font-weight:700}
nav button.on:after{content:'';width:34px;height:3px;border-radius:3px;background:var(--r);box-shadow:0 0 8px var(--r);margin-top:3px}
.row{display:flex;gap:8px}.row>*{flex:1}
#cm{height:calc(100vh - 150px);height:calc(100dvh - 150px);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 12px;border-radius:16px 16px 16px 4px;background:var(--card);border:1px solid var(--line);align-self:flex-start}
.m.me{background:var(--me);border-color:#6b2433;align-self:flex-end;border-radius:16px 16px 4px 16px}
.m small{display:block;color:var(--m);font-size:11px;margin-top:2px}
.m audio{width:210px;height:38px}
.cb{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.cb input{margin:0;border-radius:24px}.cb button{width:48px;margin:0;padding:0;border-radius:50%}
.rec{background:var(--r)!important;color:#fff}
.lb{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--ink);font-size:15px}.lb input{width:auto;min-height:0;margin:0;accent-color:var(--r)}
.c{text-align:center;padding:30px;color:var(--m)}
.splash{min-height:calc(100vh - 92px);min-height:calc(100dvh - 92px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(70% 45% at 50% 40%,rgba(255,40,70,.3),transparent 70%)}
.splash svg{filter:drop-shadow(0 0 18px rgba(255,40,70,.75));animation:beat 1.2s ease-in-out infinite}
.splash h2{font-family:system-ui,sans-serif;font-size:30px;font-weight:800;color:#fff}.splash h2 span{color:#ff2d4b}
.ecg{stroke-dasharray:100;stroke-dashoffset:100;animation:ecg 1.2s ease-in-out infinite}
.dots span{display:inline-block;width:9px;height:9px;margin:0 4px;border-radius:50%;background:var(--r);box-shadow:0 0 8px var(--r);animation:dot 1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.07)}60%{transform:scale(1)}}
@keyframes ecg{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.75)}40%{opacity:1;transform:scale(1.2)}}
.fbar{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:14px;box-shadow:var(--sh)}
.srch{position:relative}.srch span{position:absolute;left:14px;top:12px;font-size:16px;pointer-events:none}
.srch input{padding-left:42px;margin-bottom:10px;min-height:46px;background:var(--chip)}
.frow{display:flex;gap:10px}.sel{flex:1;min-width:0;display:block;margin:0}
.sel small{display:block;font-size:12px;font-weight:700;color:var(--m);margin:0 4px 4px}
.sel select{margin:0;min-height:44px;padding:8px 10px;font-size:15px;background:var(--chip)}
#l>p{font-size:14px;margin:0 4px 10px!important}
#l .card:nth-of-type(3n+1){--c:#ff2d4b}#l .card:nth-of-type(3n+2){--c:#2d8cff}#l .card:nth-of-type(3n){--c:#9b5cff}
.bagc{width:84px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center}
.bag{width:84px;height:118px;flex:none;filter:drop-shadow(0 0 6px var(--c))}
.vt{flex:1;width:5px;min-height:4px;margin-top:-1px;background:var(--c);box-shadow:0 0 8px var(--c)}
.tube{flex:none;width:96px;height:46px;overflow:visible;align-self:flex-start;margin-top:-1px;filter:drop-shadow(0 0 5px var(--c))}
.tube path{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round}
.i{display:flex;flex-direction:column}
#l .r2{display:block;margin-top:auto;padding-top:8px}#l .ac{margin-top:10px}
.dalal{margin-bottom:16px}.dalal img{display:block;width:100%;border-radius:14px;border:1.5px solid #ff2d4b;box-shadow:0 0 22px rgba(255,45,75,.5)}
.nm{display:flex;align-items:center;gap:9px}.nm b{font-size:18px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--c,#ff2d4b);box-shadow:0 0 8px var(--c,#ff2d4b);cursor:pointer}
.av.big{width:96px;height:96px;border-width:3px;cursor:default}
.ph0{display:grid;place-items:center;background:var(--chip);font-weight:800;color:var(--ink);font-size:18px}.av.big.ph0{font-size:38px}
.stats{display:flex;gap:10px;margin:-20px 14px 4px;position:relative;z-index:2}
.s3c{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.s3c b{display:block;font-size:26px;font-weight:800;line-height:1.15;text-shadow:0 0 12px currentColor}
.s3c small{display:block;color:var(--m);font-size:11.5px;margin-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
.fin{animation:rise .35s ease both}
#l.ent .card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:.6s}
#l.ent .card:nth-of-type(1){animation-delay:0.00s}
#l.ent .card:nth-of-type(2){animation-delay:0.07s}
#l.ent .card:nth-of-type(3){animation-delay:0.14s}
#l.ent .card:nth-of-type(4){animation-delay:0.21s}
#l.ent .card:nth-of-type(5){animation-delay:0.28s}
#l.ent .card:nth-of-type(6){animation-delay:0.35s}
#l.ent .card:nth-of-type(7){animation-delay:0.42s}
#l.ent .card:nth-of-type(8){animation-delay:0.49s}
#l .card.sk{height:150px;background:linear-gradient(90deg,var(--card) 25%,#1b2230 50%,var(--card) 75%)!important;background-size:200% 100%!important;animation:shim 1.3s linear infinite}
.hero>svg:first-child{animation:beat 1.8s ease-in-out infinite;transform-origin:50% 60%}.hero .hh{animation:beat 1.8s ease-in-out .35s infinite}
.shb{display:block;text-align:center;color:#fff;padding:14px;border-radius:14px;margin-bottom:10px;text-decoration:none;font-weight:700;border:0;width:100%;font-size:16px;min-height:48px}
.card.u{flex-wrap:wrap}.card.u .ac{width:100%;justify-content:flex-end}
.onl{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:3px 12px 3px 9px;border-radius:99px;font-size:12.5px;color:#9dffd0;background:rgba(51,224,138,.14);border:1px solid rgba(51,224,138,.5)}
.onl b{color:#fff;font-size:14px}
.onl i{width:9px;height:9px;border-radius:50%;background:#33e08a;box-shadow:0 0 0 0 rgba(51,224,138,.7);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(51,224,138,.7)}80%,100%{box-shadow:0 0 0 9px rgba(51,224,138,0)}}
.rv{display:inline-flex;align-items:center;gap:4px;margin:0 0 0 8px;width:auto;min-height:0;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#ffd24a;background:rgba(255,210,74,.12);border:1px solid rgba(255,210,74,.5);vertical-align:middle}.rv em{font-style:normal;color:#e9d9a8;font-weight:400}
#rvw{position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.78);display:flex;align-items:flex-end}
.rvp{width:100%;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.stx{color:#ffd24a;letter-spacing:2px}
.rvi{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:var(--chip)}
.ss{display:flex;gap:8px;margin:10px 0}.ss button{width:48px;height:48px;min-height:0;padding:0;margin:0;font-size:28px;line-height:1;border-radius:12px;color:#5b6475;background:var(--chip)}
.ss button.on{color:#ffd24a;border-color:#ffd24a;box-shadow:0 0 10px rgba(255,210,74,.45)}
.rvd{width:auto;min-height:0;margin:8px 0 0;padding:4px 12px;font-size:13px;border-radius:10px;color:var(--rt)}
.slogo{width:156px;height:156px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.14);filter:drop-shadow(0 0 22px rgba(255,60,80,.75));animation:beat 1.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.slogo{animation:none}.onl i{animation:none}.fin,#l.ent .card,#l .card.sk,.hero>svg,.hero .hh{animation:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.splash svg,.dots span{animation:none}.ecg{animation:none;stroke-dashoffset:0}}

    ${ME.pin?'':`<div class="card" style="flex-direction:column;align-items:stretch"><b>🔒 পিন সেট করুন</b><small style="color:var(--m)">আনইনস্টল করে আবার ঢুকতে এই পিন লাগবে</small><input id="pn" type="password" inputmode="numeric" maxlength="6" placeholder="৪-৬ ডিজিটের পিন"><button class="p" onclick="setPin()">পিন সংরক্ষণ</button></div>`}
    <button class="p" onclick="shareApp()" style="margin-top:4px">📤 অ্যাপটি বন্ধুদের শেয়ার করুন</button>
    <p style="color:var(--m);font-size:12px;word-break:break-all">আপনার UID: ${U.uid}</p><div class="card" style="flex-direction:column;align-items:flex-start;margin-top:14px"><b>এই অ্যাপ সম্পর্কে</b><small style="color:var(--m)">রক্তদাতা খোঁজার জন্য এই অ্যাপটি তৈরি করেছেন<br><b style="color:var(--ink)">রুহুল আমিন</b><br>রুহুল আমিন মোবাইল সার্ভিসিং সেন্টার, বানিবহ, রাজবাড়ী</small></div>`;
  A.innerHTML=`${tab==='home'?hero()+statsHtml():'<header>🩸 ব্লাড ডোনার</header>'}<div class="w${ANIM?' fin':''}">${c}</div><nav>${[['home','🏠','দাতা'],['urg','🚨','জরুরি'],['chat','💬','চ্যাট'],['me','👤','আমি']].map(([k,i,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';ANIM=true;render()"><span>${i}</span>${v}</button>`).join('')}</nav>`;if(tab==='home')stats();if(ANIM&&!ANIMT&&(tab!=='home'||USERS.length))ANIMT=setTimeout(()=>{ANIM=false;ANIMT=0},900)}

async function saveMe(){const d={name:$('#en').value.trim(),dist:$('#ed').value,area:$('#ea').value.trim(),group:$('#eg').value,avail:$('#av').checked,last:$('#la').value||'',ts:Date.now()};
  if(!d.name||!d.area||!d.dist)return alert('নাম, জেলা ও এলাকা খালি রাখা যাবে না');
  try{await db.collection('users').doc(U.uid).update(d);Object.assign(ME,d);DST=d.dist;render();alert('সংরক্ষণ হয়েছে')}catch(e){alert('সমস্যা: '+e.message)}}
async function post(e){e.preventDefault();const f=e.target;
  await db.collection('urgent').add({group:f.group.value,place:f.place.value.trim(),phone:f.phone.value.trim(),note:f.note.value.trim(),name:ME.name,uid:U.uid,ts:Date.now()});f.reset()}
async function del(c,id){if(confirm('মুছে ফেলবেন?'))await db.collection(c).doc(id).delete()}
async function pm(id){const o=USERS.find(u=>u.id===id),cid=[U.uid,id].sort().join('_');
  await db.collection('chats').doc(cid).set({members:[U.uid,id],names:{[U.uid]:ME.name,[id]:o.name},ts:Date.now()},{merge:true});openChat(cid,o.name)}

let CT='';
function openChat(cid,title){inChat=true;CID=cid;CT=title;
  A.innerHTML=`<header><span onclick="closeChat()" style="margin-right:12px">←</span>${esc(title)}${cid==='all'?'':`<span style="float:right" onclick="startCall('${cid.split('_').find(x=>x!==U.uid)}',CT)">📞</span>`}</header><div id="cm"></div><div class="cb"><button id="mic" onclick="mic()">🎤</button><input id="tx" placeholder="মেসেজ লিখুন" onkeydown="if(event.key==='Enter')sendT()"><button class="p" onclick="sendT()">➤</button></div>`;
  unsub=db.collection('chats').doc(cid).collection('m').orderBy('ts','desc').limit(100).onSnapshot(s=>{
    const b=$('#cm');if(!b)return;
    b.innerHTML=s.docs.reverse().map(d=>{const m=d.data(),me=m.from===U.uid;
      return `<div class="m ${me?'me':''}">${me?'':`<small>${esc(m.name)}</small>`}${m.type==='voice'?`<audio controls src="${esc(m.data)}"></audio>`:esc(m.text)}<small>${new Date(m.ts).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})}</small></div>`}).join('');
    b.scrollTop=b.scrollHeight})}
function closeChat(){unsub&&unsub();inChat=false;render()}
async function send(m){Object.assign(m,{from:U.uid,name:ME.name,ts:Date.now()});
  await db.collection('chats').doc(CID).collection('m').add(m);
  if(CID!=='all')db.collection('chats').doc(CID).set({ts:m.ts,last:m.type==='voice'?'🎤 ভয়েস মেসেজ':m.text},{merge:true})}
function sendT(){const t=$('#tx'),v=t.value.trim();if(!v)return;t.value='';send({type:'text',text:v})}

let rec,chunks,tm;
async function mic(){const b=$('#mic');
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st,{audioBitsPerSecond:16000});chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(tm);b.textContent='🎤';b.classList.remove('rec');
      const r=new FileReader();r.onload=()=>{if(r.result.length>900000)return alert('ভয়েস অনেক বড়, ছোট করে পাঠান');send({type:'voice',data:r.result})};
      r.readAsDataURL(new Blob(chunks,{type:rec.mimeType}))};
    rec.start();b.textContent='⏹';b.classList.add('rec');tm=setTimeout(()=>rec.stop(),60000)
  }catch(e){alert('মাইক চালু করা যায়নি। অ্যাপের মাইক পারমিশন দিন।')}}

// ===== অনলাইন ভয়েস কল =====
let PC,LS,CALL=null,RING=null,CU=[],PEND=[],RT,CN='',TT;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function cui(h){let e=$('#cu');if(!e){e=document.createElement('div');e.id='cu';e.style.cssText='position:fixed;inset:0;background:rgba(27,31,42,.94);color:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px';document.body.appendChild(e)}e.innerHTML=h}
const cbtn=(t,f,c)=>`<button onclick="${f}" style="width:200px;background:${c};color:#fff;border:0;font-weight:700">${t}</button>`;
function newPC(){const p=new RTCPeerConnection(ICE);PEND=[];
  p.ontrack=e=>{let a=$('#ra');if(!a){a=document.createElement('audio');a.id='ra';a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play&&a.play().catch(()=>{})};
  p.onconnectionstatechange=()=>{if(p.connectionState==='connected'){clearTimeout(RT);const t0=Date.now();clearInterval(TT);
      cui(`<div style="font-size:56px">🎧</div><h2>${esc(CN)}</h2><div id="tm" style="font-size:26px">00:00</div>`+cbtn('কাটুন','hang()','#B3122B'));
      TT=setInterval(()=>{const e=$('#tm');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},1000)}
    else if(p.connectionState==='failed')hang('সংযোগ হয়নি। নেটওয়ার্কের কারণে কল লাগেনি।')};
  return p}
function watch(ref,caller){
  const u1=ref.onSnapshot(async s=>{const d=s.data();if(!d||!PC)return;
    if(caller&&d.answer&&!PC.remoteDescription){await PC.setRemoteDescription(d.answer);PEND.forEach(c=>PC.addIceCandidate(c).catch(()=>{}));PEND=[]}
    if(d.status==='ended'||d.status==='rejected')finish(d.status==='rejected'?'কল কেটে দিয়েছে':'কল শেষ হয়েছে')});
  const u2=ref.collection('cand').onSnapshot(q=>q.docChanges().forEach(c=>{if(c.type!=='added')return;const x=c.doc.data();if(x.from===U.uid||!PC)return;
    const ic=JSON.parse(x.c);PC.remoteDescription?PC.addIceCandidate(ic).catch(()=>{}):PEND.push(ic)}));
  CU=[u1,u2]}
async function mic0(){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('মাইক চালু করা যায়নি। অ্যাপের মাইকের অনুমতি দিন।');return null}}
async function startCall(to,name){if(CALL||!to)return;LS=await mic0();if(!LS)return;CN=name;
  const ref=db.collection('calls').doc();CALL=ref.id;PC=newPC();LS.getTracks().forEach(t=>PC.addTrack(t,LS));
  PC.onicecandidate=e=>e.candidate&&ref.collection('cand').add({from:U.uid,c:JSON.stringify(e.candidate)}).catch(()=>{});
  try{const o=await PC.createOffer();
    await ref.set({from:U.uid,fromName:ME.name,to,status:'ringing',offer:{type:o.type,sdp:o.sdp},ts:Date.now()});
    await PC.setLocalDescription(o)}catch(e){return finish('কল শুরু করা যায়নি')}
  cui(`<div style="font-size:56px">📞</div><h2>${esc(name)} কে কল হচ্ছে...</h2>`+cbtn('কাটুন','hang()','#B3122B'));
  watch(ref,true);RT=setTimeout(()=>hang('কেউ ধরেনি'),45000)}
function ring(id,d){CN=d.fromName||'কেউ';try{navigator.vibrate&&navigator.vibrate([500,300,500,300,500])}catch(e){}
  cui(`<div style="font-size:56px">📞</div><h2>${esc(CN)} কল করছে</h2>`+cbtn('ধরুন','answer()','#12805C')+cbtn('কাটুন','reject()','#B3122B'))}
async function answer(){const id=RING;if(!id)return;RING=null;LS=await mic0();if(!LS)return reject();
  const ref=db.collection('calls').doc(id);
  try{const d=(await ref.get()).data();if(!d||d.status!=='ringing')return finish('কল শেষ হয়ে গেছে');
    PC=newPC();LS.getTracks().forEach(t=>PC.addTrack(t,LS));
    PC.onicecandidate=e=>e.candidate&&ref.collection('cand').add({from:U.uid,c:JSON.stringify(e.candidate)}).catch(()=>{});
    await PC.setRemoteDescription(d.offer);const a=await PC.createAnswer();await PC.setLocalDescription(a);
    await ref.update({answer:{type:a.type,sdp:a.sdp},status:'accepted'});
    cui(`<h2>${esc(CN)}</h2><p>সংযোগ হচ্ছে...</p>`+cbtn('কাটুন','hang()','#B3122B'));watch(ref,false);
    RT=setTimeout(()=>{if(PC&&PC.connectionState!=='connected')hang('সংযোগ হয়নি')},20000)}catch(e){finish('কল ধরা যায়নি')}}
function reject(){const id=RING||CALL;RING=null;if(id)db.collection('calls').doc(id).update({status:'rejected'}).catch(()=>{});finish('')}
function hang(m){if(CALL)db.collection('calls').doc(CALL).update({status:'ended'}).catch(()=>{});finish(m||'')}
function finish(m){if(!CALL&&!PC&&!$('#cu'))return;clearTimeout(RT);clearInterval(TT);CU.forEach(f=>f());CU=[];
  try{PC&&PC.close()}catch(e){}PC=null;LS&&LS.getTracks().forEach(t=>t.stop());LS=null;CALL=null;RING=null;PEND=[];
  const a=$('#ra');a&&a.remove();
  if(m){cui(`<h2>${esc(m)}</h2>`);setTimeout(()=>{const e=$('#cu');e&&e.remove()},1800)}else{const e=$('#cu');e&&e.remove()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
